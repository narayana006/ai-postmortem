[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-postmortem"
version = "0.1.0"
description = "Build an incident timeline and a blameless postmortem draft from a chat export, alert log and deploy events."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Narayana Vemburaj" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ai-postmortem = "ai_postmortem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_postmortem = ["templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
