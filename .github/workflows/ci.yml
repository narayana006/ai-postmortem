name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[dev]"
      - run: pytest -q
      - name: Smoke-test the CLI on the example incident
        run: |
          ai-postmortem draft --slack examples/slack-export \
            --pagerduty examples/pagerduty-log.json \
            --deploys examples/deploys.csv > draft.md
          diff draft.md examples/draft-google-sre.md
